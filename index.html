<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Choose wisely 😏</title>

<style>
:root{
  --card-bg: rgba(255,255,255,0.92);
  --text: #111;
  --yes: #ff4d6d;
  --no: #cfd4da;
  --shadow: 0 18px 50px rgba(0,0,0,0.18);
  --radius: 18px;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top: 33vh;   /* 화면 위에서 1/3 지점 */
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
  color: var(--text);
  overflow:hidden;
}


.bg{
  position: fixed;
  inset: 0;
  background-image: url("유리.jpg");
  background-size: cover;
  background-position: center;
}

.bg::after{
  content:"";
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.25);
}

.card{
  position: relative;
  width: min(92vw, 520px);
  padding: 26px 22px 22px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 1;
}

.title{
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 18px;
  text-align:center;
}

.buttons{
  position: relative;
  height: 60px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
}

button{
  border: 0;
  cursor: pointer;
  height: 44px;
  padding: 0 20px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 15px;
  transition: transform .1s ease;
}

#yesBtn{
  background: var(--yes);
  color: white;
}

#noBtn{
  position: absolute;
  background: var(--no);
  color: #222;
  left: 65%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.result{
  display:none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 14px;
  background: rgba(255,77,109,0.12);
  text-align:center;
  font-weight:700;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">
  <p class="title">최유리 콘서트 같이 갈래?</p>

  <div class="buttons" id="btnArea">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const btnArea = document.getElementById("btnArea");
const result = document.getElementById("result");

function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

function moveNoButton(e){
  const areaRect = btnArea.getBoundingClientRect();
  const noRect = noBtn.getBoundingClientRect();

  const pointerX = e.clientX;
  const pointerY = e.clientY;

  const noCenterX = noRect.left + noRect.width/2;
  const noCenterY = noRect.top + noRect.height/2;

  let dx = noCenterX - pointerX;
  let dy = noCenterY - pointerY;

  const len = Math.hypot(dx, dy);
  if(len !== 0){
    dx /= len;
    dy /= len;
  }

  const escape = 100;

  let newLeft = parseFloat(noBtn.style.left || areaRect.width * 0.65) + dx * escape;
  let newTop = parseFloat(noBtn.style.top || areaRect.height * 0.5) + dy * escape;

  newLeft = clamp(newLeft, 20, areaRect.width - 60);
  newTop = clamp(newTop, 20, areaRect.height - 40);

  noBtn.style.left = newLeft + "px";
  noBtn.style.top = newTop + "px";
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("mousemove", moveNoButton);
noBtn.addEventListener("click", moveNoButton);

yesBtn.addEventListener("click", () => {
  result.style.display = "block";
  result.textContent = "그래도 나는 유리야";
});
</script>

</body>
</html>
